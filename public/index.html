<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Oswald:wght@200..700&family=Special+Gothic+Expanded+One&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap');
        </style>
    <title>CHAT APPLICATION</title>
 
</head>

<body>
    <div class="title">My chat</div>
    <div class="main">
        <div class="name">
            <i class="fa-brands fa-whatsapp"></i>
           <input type="text " id="name-input"
           class="name-input" value="anonymous">
        </div>
        <div class="chat-area">
            <ul class="message-conainer">
                <li class="message-left">
                    <p class="message">
                        test message
                    </p>
                    <span> me . 25 july 10:30</span>
                </li>
                <li class="message-right">
                    <p class="message">
                        test message
                    </p>
                    <span> me . 25 july 10:30</span>
                </li>
                <li class="message-feedback">
                    <p class="feddback">
                        Ali is typing...
                    </p>
                </li>
            </ul>
            <form class="message-form" id="message-form">
                <input type="text" name="message-input" 
                id="message-input" class="message-input">
                <div class="v-divder"></div>
                <button type="submit" class="send-button">send 
                <i class="fa-solid fa-paper-plane"></i></button>
            </form>
        </div>
        
    </div>
    <h3 class="clients-total" id="clients-total">clients-total : 0 </h3>
    <script src="/socket.io/socket.io.js"></script>
    <script src="./main.js"></script>
</body>
</html>
